[project]
name = "dapur-kita"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django==6.0.3",
  "djangorestframework==3.17.1",
  "django-cors-headers==4.9.0",
  "dj-database-url==3.1.2",
  "python-dotenv==1.2.2",
  "psycopg2-binary==2.9.11",
  "whitenoise==6.12.0",
  # Evaluated FreshCast inference runtime; no training/notebook dependencies.
  "catboost==1.2.10",
  "numpy==2.5.3",
  "pandas==2.3.3",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "plotly==7.1.0",
  "six==1.17.0",
  "graphviz==0.21",
]

[tool.vercel]
entrypoint = "app:application"

[tool.vercel.scripts]
build = "python build.py"
