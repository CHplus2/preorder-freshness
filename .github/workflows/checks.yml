name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    name: PostgreSQL concurrency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: bash scripts/check_postgres.sh
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-not-for-production
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r backend/predictive_ai/requirements-ml.lock
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:predictive
      - run: npm --prefix frontend run test:ux
      - run: npm --prefix frontend run test:planner
      - run: npm --prefix frontend run test:checkout
      - run: npm --prefix frontend run test:escrow
      - run: npm --prefix frontend run test:paypal
      - run: npm --prefix frontend run test:shopping
      - run: npm --prefix frontend run test:images
      - run: npm --prefix frontend run build
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test myapp --noinput
      - run: python manage.py collectstatic --noinput
      - run: python -m unittest discover -s tests -v
  escrow:
    name: Escrow contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: escrow/package-lock.json
      - run: npm ci --prefix escrow --ignore-scripts
      - run: npm --prefix escrow test
